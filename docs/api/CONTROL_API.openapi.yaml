openapi: 3.1.0
info:
  title: DocMap Control API
  version: "1.0.0"
servers:
  - url: /api

paths:
  /runs:
    get:
      summary: List pipeline runs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/PipelineRunStatus"
        - in: query
          name: pipeline_type
          schema:
            $ref: "#/components/schemas/PipelineType"
      responses:
        "200":
          description: Runs list
    post:
      summary: Enqueue start_run command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAcceptedResponse"
        "409":
          description: Invalid request or duplicate pending command

  /runs/{run_id}:
    get:
      summary: Get run details
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run details
        "404":
          description: Not found

  /runs/{run_id}/stages:
    get:
      summary: List stage rows for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Stage rows
        "404":
          description: Not found

  /runs/{run_id}/progress:
    get:
      summary: List progress rows for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Progress rows
        "404":
          description: Not found

  /runs/{run_id}/logs:
    get:
      summary: List persisted logs for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: query
          name: after_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - in: query
          name: level
          schema:
            type: string
        - in: query
          name: stage_name
          schema:
            type: string
        - in: query
          name: service_name
          schema:
            type: string
      responses:
        "200":
          description: Log rows
        "404":
          description: Not found

  /runs/{run_id}/events:
    get:
      summary: Stream run events via SSE
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: query
          name: last_event_id
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /runs/{run_id}/cancel:
    post:
      summary: Enqueue cancel_run command
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Command accepted
        "404":
          description: Not found

  /runs/{run_id}/retry:
    post:
      summary: Enqueue retry_run command
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRunRequest"
      responses:
        "202":
          description: Command accepted
        "404":
          description: Not found

  /runs/{run_id}/stages/{stage_name}/retry:
    post:
      summary: Enqueue retry_stage command
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/StageName"
      responses:
        "202":
          description: Command accepted
        "404":
          description: Not found

  /runs/{run_id}/stages/{stage_name}/resume:
    post:
      summary: Enqueue stage resume command (retry_stage with resume=true)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/StageName"
      responses:
        "202":
          description: Command accepted
        "404":
          description: Not found

  /commands/{command_id}:
    get:
      summary: Get command status
      parameters:
        - in: path
          name: command_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Command row
        "404":
          description: Not found

components:
  parameters:
    RunId:
      in: path
      name: run_id
      required: true
      schema:
        type: integer
        minimum: 1
    StageName:
      in: path
      name: stage_name
      required: true
      schema:
        $ref: "#/components/schemas/StageName"

  schemas:
    PipelineRunStatus:
      type: string
      enum: [pending, running, cancelling, cancelled, failed, success]

    PipelineType:
      type: string
      enum: [full_pipeline, crawl_only, extract_only, geocode_only, analytics_only, export_only]

    StageName:
      type: string
      enum: [crawl, extract, geocode, analytics, export]

    TargetScope:
      type: string
      enum: [all, single_document, document_range, incremental]

    StartRunRequest:
      type: object
      required: [pipeline_type, target_scope]
      properties:
        pipeline_type:
          $ref: "#/components/schemas/PipelineType"
        target_scope:
          $ref: "#/components/schemas/TargetScope"
        document_url:
          type: string
          nullable: true
        document_range:
          type: object
          nullable: true
          properties:
            start:
              type: integer
            end:
              type: integer
        options:
          type: object
          additionalProperties: true
          description: |
            Open options object. Current runtime recognizes keys including:
            process_unprocessed_only, refresh_canonical_dictionary, refresh_geo_identity.

    RetryRunRequest:
      type: object
      properties:
        options:
          type: object
          additionalProperties: true

    CommandAcceptedResponse:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: integer
        status:
          type: string
          enum: [pending]
        message:
          type: string
          nullable: true